<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolución de un Sistema Web</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="tarjeta">
      <h1>Evolución Controlada de un Sistema Web</h1>
      <p class="subtitulo">
        Proyecto de la Guía 07: control de versiones con Git y GitHub.
      </p>

      <h2>Registro de visitante</h2>
      <p>Ingrese su nombre:</p>
      <input
        type="text"
        id="nombre"
        placeholder="Escribe tu nombre"
        maxlength="30"
        oninput="actualizarContador()"
      />
      <button onclick="saludar()">Saludar</button>
      <small id="contador" class="contador">0 / 30</small>
      <p id="resultado" class="mensaje"></p>

      <h2>Validar correo</h2>
      <input type="email" id="correo" placeholder="Ingrese su correo" />
      <button onclick="validarCorreo()">Validar correo</button>
      <p id="mensajeCorreo" class="mensaje"></p>
    </main>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
